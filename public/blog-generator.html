<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Générateur Blog SEO – Matcha & Pilates</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 20px; background: #f9f5f0; }
  h1 { color: #5a3e2b; text-align: center; }
  label { font-weight: bold; display: block; margin-top: 20px; color: #5a3e2b; }
  input, select, textarea { width: 100%; padding: 10px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; font-size: 15px; box-sizing: border-box; }
  button { background: #5a3e2b; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; cursor: pointer; margin-top: 20px; width: 100%; }
  button:hover { background: #7a5e4b; }
  #result { margin-top: 30px; background: white; padding: 20px; border-radius: 8px; white-space: pre-wrap; line-height: 1.8; border: 1px solid #ddd; display: none; }
  #copy-btn { background: #2ecc71; display: none; }
  #loading { text-align: center; display: none; color: #5a3e2b; font-size: 18px; margin-top: 20px; }
</style>
</head>
<body>
<h1>🍵 Générateur d'Articles SEO</h1>
<p style="text-align:center;color:#888">Matcha & Pilates — Créez des articles optimisés Google en 1 clic</p>

<label>Sujet de l'article</label>
<input type="text" id="sujet" placeholder="ex: bienfaits du matcha pour le pilates" />

<label>Produit à mettre en avant (optionnel)</label>
<input type="text" id="produit" placeholder="ex: Matcha Bloom Bio" />

<label>Longueur de l'article</label>
<select id="longueur">
  <option value="court">Court (400 mots)</option>
  <option value="moyen" selected>Moyen (700 mots) — recommandé</option>
  <option value="long">Long (1200 mots)</option>
</select>

<button onclick="generer()">✨ Générer l'article SEO</button>
<div id="loading">⏳ Claude rédige votre article...</div>
<div id="result"></div>
<button id="copy-btn" onclick="copier()">📋 Copier l'article</button>

<script>
async function generer() {
  const sujet = document.getElementById('sujet').value;
  const produit = document.getElementById('produit').value;
  const longueur = document.getElementById('longueur').value;
  if (!sujet) { alert('Entrez un sujet !'); return; }
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').style.display = 'none';
  document.getElementById('copy-btn').style.display = 'none';
  const mots = longueur === 'court' ? 400 : longueur === 'moyen' ? 700 : 1200;
  try {
    const response = await fetch('/api/claude', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: `Tu es expert SEO pour Matcha & Pilates, boutique bien-être française. Tu rédiges des articles optimisés Google en français, ton doux et lifestyle.`,
        messages: [{ role: 'user', content: `Rédige un article SEO de ${mots} mots sur : "${sujet}". ${produit ? `Mentionne le produit "${produit}".` : ''} Inclus titre H1, introduction, sous-titres H2, conclusion avec lien vers matchandpilates.com.` }]
      })
    });
    const data = await response.json();
    document.getElementById('result').style.display = 'block';
    document.getElementById('result').innerText = data.content[0].text;
    document.getElementById('copy-btn').style.display = 'block';
  } catch(e) { alert('Erreur : ' + e.message); }
  document.getElementById('loading').style.display = 'none';
}
function copier() {
  navigator.clipboard.writeText(document.getElementById('result').innerText);
  document.getElementById('copy-btn').innerText = '✅ Copié !';
  setTimeout(() => document.getElementById('copy-btn').innerText = '📋 Copier l\'article', 2000);
}
</script>
</body>
</html>
